repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^_ds/
      - id: end-of-file-fixer
        exclude: ^_ds/
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.2
    hooks:
      # Scan the working tree, not just staged changes: CI has no staged diff.
      - id: betterleaks
        entry: betterleaks dir . --redact --validation=false
        pass_filenames: false
        always_run: true

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        pass_filenames: true
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint-fix
        files: ^(README\.md|AGENTS\.md|\.github/.*\.md)$

  - repo: local
    hooks:
      - id: course-checks
        name: course tests and JavaScript syntax
        entry: bash -c 'node --test tests/course-state.test.mjs && node --test tests/course-template.test.mjs && node --check course-state.js && node --check support.js'
        language: system
        pass_filenames: false
        always_run: true
