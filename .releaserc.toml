[semantic_release]
tag_format = "v{version}"
# Start at v1.0.0 when the first releasable change reaches main.
allow_zero_version = false
# Stamp the Help version in the same release commit as the changelog and tag.
version_variables = ["ai-101-course.html:courseVersion:tf"]
commit_message = "chore(release): {version} [skip ci]"

[semantic_release.branches.main]
match = "main"

[semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[semantic_release.remote]
token = { env = "GH_TOKEN" }
